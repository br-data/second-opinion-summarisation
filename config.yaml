isEnabled: true
image: python:3.11-slim-bookworm
build:
  command: pip install -r requirements.txt
run:
  command: python app.py
  envs:
    - name: AZURE_API_KEY
      value: sm://{{.projectId}}/aiditor-azure-open-ai
    - name: AZURE_EMBEDDING_DEPLOYMENT
      value: text-embedding-3-small
settings:
  type: service
  security:
    type: none
    enableCors: true
    corsOrigins:
      - "http://localhost:3000"
    useLoginFallback: false
